version: 2
project_name: jr
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/jr
    binary: jr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: jr
    binaries:
      - jr
    repository:
      owner: addozhang
      name: homebrew-tap
      # Uses HOMEBREW_TAP_GITHUB_TOKEN secret in the release workflow.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/addozhang/jira-cli"
    description: "URL-native Jira Server / Data Center CLI"
